# Exact allowlist for synthetic browser self-test. No backend or credentials.
location = /dbmoe/browser-selftest { return 302 /dbmoe/browser-selftest/; }
location = /dbmoe/browser-selftest/ {
    root /opt/agillm43_netserve/dbmoe-browser-selftest;
    try_files /index.html =404;
    types { }
    default_type text/html;
    include /opt/agillm43_netserve/dbmoe-browser-selftest.headers.conf;
}
location = /dbmoe/browser-selftest/selftest.js {
    alias /opt/agillm43_netserve/dbmoe-browser-selftest/selftest.js;
    types { }
    default_type text/javascript;
    include /opt/agillm43_netserve/dbmoe-browser-selftest.headers.conf;
}
location = /dbmoe/browser-selftest/selftest_worker.js {
    alias /opt/agillm43_netserve/dbmoe-browser-selftest/selftest_worker.js;
    types { }
    default_type text/javascript;
    include /opt/agillm43_netserve/dbmoe-browser-selftest.headers.conf;
}
location = /dbmoe/browser-selftest/model.js {
    alias /opt/agillm43_netserve/dbmoe-browser-selftest/model.js;
    types { }
    default_type text/javascript;
    include /opt/agillm43_netserve/dbmoe-browser-selftest.headers.conf;
}
location = /dbmoe/browser-selftest/style.css {
    alias /opt/agillm43_netserve/dbmoe-browser-selftest/style.css;
    types { }
    default_type text/css;
    include /opt/agillm43_netserve/dbmoe-browser-selftest.headers.conf;
}
location = /dbmoe/browser-selftest/TENSORFLOWJS-LICENSE.txt {
    alias /opt/agillm43_netserve/dbmoe-browser-selftest/TENSORFLOWJS-LICENSE.txt;
    types { }
    default_type text/plain;
    include /opt/agillm43_netserve/dbmoe-browser-selftest.headers.conf;
}
location = /dbmoe/browser-selftest/fixtures/parity.json {
    alias /opt/agillm43_netserve/dbmoe-browser-selftest/fixtures/parity.json;
    types { }
    default_type application/json;
    include /opt/agillm43_netserve/dbmoe-browser-selftest.headers.conf;
}
location = /dbmoe/browser-selftest/fixtures/parity-skewed.json {
    alias /opt/agillm43_netserve/dbmoe-browser-selftest/fixtures/parity-skewed.json;
    types { }
    default_type application/json;
    include /opt/agillm43_netserve/dbmoe-browser-selftest.headers.conf;
}
location = /dbmoe/browser-selftest/vendor/tf.min.js {
    alias /opt/agillm43_netserve/dbmoe-browser-selftest/vendor/tf.min.js;
    types { }
    default_type text/javascript;
    include /opt/agillm43_netserve/dbmoe-browser-selftest.headers.conf;
}
location = /dbmoe/browser-selftest/vendor/tf-backend-webgpu.min.js {
    alias /opt/agillm43_netserve/dbmoe-browser-selftest/vendor/tf-backend-webgpu.min.js;
    types { }
    default_type text/javascript;
    include /opt/agillm43_netserve/dbmoe-browser-selftest.headers.conf;
}
location = /dbmoe/browser-selftest/vendor/tf-backend-wasm.min.js {
    alias /opt/agillm43_netserve/dbmoe-browser-selftest/vendor/tf-backend-wasm.min.js;
    types { }
    default_type text/javascript;
    include /opt/agillm43_netserve/dbmoe-browser-selftest.headers.conf;
}
location = /dbmoe/browser-selftest/vendor/tfjs-backend-wasm.wasm {
    alias /opt/agillm43_netserve/dbmoe-browser-selftest/vendor/tfjs-backend-wasm.wasm;
    types { }
    default_type application/wasm;
    include /opt/agillm43_netserve/dbmoe-browser-selftest.headers.conf;
}
location = /dbmoe/browser-selftest/vendor/tfjs-backend-wasm-simd.wasm {
    alias /opt/agillm43_netserve/dbmoe-browser-selftest/vendor/tfjs-backend-wasm-simd.wasm;
    types { }
    default_type application/wasm;
    include /opt/agillm43_netserve/dbmoe-browser-selftest.headers.conf;
}
location = /dbmoe/browser-selftest/vendor/tfjs-backend-wasm-threaded-simd.wasm {
    alias /opt/agillm43_netserve/dbmoe-browser-selftest/vendor/tfjs-backend-wasm-threaded-simd.wasm;
    types { }
    default_type application/wasm;
    include /opt/agillm43_netserve/dbmoe-browser-selftest.headers.conf;
}
location ^~ /dbmoe/browser-selftest/ { return 404; }
location @dbmoe_browser_static_not_found { default_type text/plain; return 404 "Static test asset not found.\n"; }
